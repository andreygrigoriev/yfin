name: release

# Creates a GitHub release with the module jars for a v* tag (v1.2.3 -> 1.2.3). Maven Central
# publishing is done locally before the tag is pushed (see CONTRIBUTING.md, "Releasing"), so
# this workflow needs no secrets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set version from tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./mvnw --batch-mode --no-transfer-progress versions:set \
            -DnewVersion="$version" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build jars
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "yfin $VERSION" --generate-notes $prerelease \
            yfin-core/target/yfin-core-"$VERSION".jar \
            yfin-live/target/yfin-live-"$VERSION".jar \
            yfin-tablesaw/target/yfin-tablesaw-"$VERSION".jar \
            yfin-dflib/target/yfin-dflib-"$VERSION".jar
