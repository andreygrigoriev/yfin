name: release

# Publishes all modules to Maven Central under the version from the tag (v1.2.3 -> 1.2.3)
# and creates a GitHub release. Required secrets: CENTRAL_USERNAME, CENTRAL_TOKEN
# (Central Portal user token), GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version from tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./mvnw --batch-mode --no-transfer-progress versions:set \
            -DnewVersion="$version" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "yfin $VERSION" --generate-notes $prerelease \
            yfin-core/target/yfin-core-"$VERSION".jar \
            yfin-live/target/yfin-live-"$VERSION".jar \
            yfin-tablesaw/target/yfin-tablesaw-"$VERSION".jar \
            yfin-dflib/target/yfin-dflib-"$VERSION".jar
