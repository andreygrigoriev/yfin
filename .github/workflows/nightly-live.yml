name: nightly-live

# Live integration suite against Yahoo Finance. Yahoo changes endpoints and throttling
# without notice; this run is the early-warning signal. On failure it opens an issue
# labelled "nightly-live", or comments on the one already open.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Live integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -Plive

      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/"
          retention-days: 14

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="nightly-live"
          gh label create "$label" --color B60205 \
            --description "Nightly live integration suite failure" 2>/dev/null || true
          body="Nightly live suite failed on $(date -u +%Y-%m-%d) at ${GITHUB_SHA::7}: $RUN_URL"
          number=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Nightly live suite failing" --label "$label" --body "$body"
          fi
